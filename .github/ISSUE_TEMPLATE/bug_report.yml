name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do **not** paste tokens, personal paths, or private session content.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: DSH Desktop / Harness version if known
      placeholder: e.g. DSH Desktop 0.12.1 / Harness 0.2.1-rc.2
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Redact tokens, account names and private content first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, personal paths and private content from this report
          required: true
